AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Databricks PRD to Supabase incremental sync — runs on schedule via EventBridge.
  Uses OAuth M2M (Service Principal) for Databricks authentication.

Globals:
  Function:
    Timeout: 300
    MemorySize: 256
    Runtime: nodejs20.x

Parameters:
  DatabricksHost:
    Type: String
    Description: Databricks PRD SQL warehouse hostname
  DatabricksHttpPath:
    Type: String
    Description: Databricks PRD SQL warehouse HTTP path
  DatabricksClientId:
    Type: String
    Description: Service Principal Application (Client) ID
  DatabricksClientSecret:
    Type: String
    NoEcho: true
    Description: Service Principal OAuth secret
  DatabricksQasHost:
    Type: String
    Default: ""
    Description: QAS workspace host (optional; pipelines with databricks_profile=qas)
  DatabricksQasHttpPath:
    Type: String
    Default: ""
    Description: QAS SQL warehouse HTTP path
  DatabricksQasToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: QAS Personal Access Token (PAT)
  SupabaseUrl:
    Type: String
    Description: Supabase project URL (https://xxx.supabase.co)
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supabase service_role API key
  SupabaseSecondaryUrl:
    Type: String
    Default: ""
    Description: Second Supabase project URL (optional; pipelines with supabase_profile=secondary)
  SupabaseSecondaryServiceRoleKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Service role for second Supabase project (optional)
  SupabaseTertiaryUrl:
    Type: String
    Default: ""
    Description: Third Supabase project URL (optional; pipelines with supabase_profile=tertiary)
  SupabaseTertiaryServiceRoleKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Secret / service_role key for third Supabase project (optional)
  SupabaseBaseSocioUrl:
    Type: String
    Default: ""
    Description: Base Socio Supabase project URL (pipelines socio_adelca_* and cartera; supabase_profile=base_socio)
  SupabaseBaseSocioServiceRoleKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Service role for Base Socio Supabase project (optional)
  DbxTable:
    Type: String
    Default: prod.gldlogistica.db_trade_dim_app_transportistas
    Description: Databricks source table (catalog.schema.table)
  BatchSize:
    Type: String
    Default: "500"
    Description: Rows per upsert batch
  ScheduleExpression:
    Type: String
    Default: cron(0 5 * * ? *)
    Description: How often to run the sync (EventBridge schedule)
  ScheduledPipelinesEnabled:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: When false, all EventBridge schedules for the sync Lambda are disabled (invoke still works).
  ViajesScheduleEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: When false, viajes cron is off (manual invoke only). Other pipeline schedules unchanged.
  SkipEtlWatermark:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: When true, skip etl_watermarks read/write (use S3 checkpoints; Base Socio has no ETL tables).

Conditions:
  ScheduledPipelinesOn: !Equals [!Ref ScheduledPipelinesEnabled, "true"]
  ViajesScheduleOn: !And
    - !Condition ScheduledPipelinesOn
    - !Equals [!Ref ViajesScheduleEnabled, "true"]

Resources:
  EtlLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub patek-philippe-etl-logs-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: RetainLogs90Days
            Status: Enabled
            ExpirationInDays: 90

  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: patek-philippe
      Handler: handler.lambdaHandler
      CodeUri: lambda_function/
      Timeout: 900
      Description: Incremental sync transportistas from Databricks PRD to Supabase fleet_owners
      Environment:
        Variables:
          DATABRICKS_HOST: !Ref DatabricksHost
          DATABRICKS_HTTP_PATH: !Ref DatabricksHttpPath
          DATABRICKS_CLIENT_ID: !Ref DatabricksClientId
          DATABRICKS_CLIENT_SECRET: !Ref DatabricksClientSecret
          # Mismos valores con prefijo PRD — equivalente a transportistas_sync/.env
          DATABRICKS_PRD_HOST: !Ref DatabricksHost
          DATABRICKS_PRD_HTTP_PATH: !Ref DatabricksHttpPath
          DATABRICKS_PRD_CLIENT_ID: !Ref DatabricksClientId
          DATABRICKS_PRD_CLIENT_SECRET: !Ref DatabricksClientSecret
          DATABRICKS_QAS_HOST: !Ref DatabricksQasHost
          DATABRICKS_QAS_HTTP_PATH: !Ref DatabricksQasHttpPath
          DATABRICKS_QAS_TOKEN: !Ref DatabricksQasToken
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_SECONDARY_URL: !Ref SupabaseSecondaryUrl
          SUPABASE_SECONDARY_SERVICE_ROLE_KEY: !Ref SupabaseSecondaryServiceRoleKey
          SUPABASE_TERTIARY_URL: !Ref SupabaseTertiaryUrl
          SUPABASE_TERTIARY_SERVICE_ROLE_KEY: !Ref SupabaseTertiaryServiceRoleKey
          SUPABASE_BASE_SOCIO_URL: !Ref SupabaseBaseSocioUrl
          SUPABASE_BASE_SOCIO_SERVICE_ROLE_KEY: !Ref SupabaseBaseSocioServiceRoleKey
          DBX_TABLE: !Ref DbxTable
          BATCH_SIZE: !Ref BatchSize
          ETL_LOGS_BUCKET: !Ref EtlLogsBucket
          # Set to "true" if the Supabase project has no etl_watermarks table (e.g. Base Socio).
          SKIP_ETL_WATERMARK: !Ref SkipEtlWatermark
          # S3 prefix for per-pipeline latest.json success checkpoints (same bucket as ETL_LOGS_BUCKET).
          ETL_SUCCESS_PREFIX: etl-success
          DEFAULT_PIPELINE: transportistas
          PIPELINES_CONFIG_PATH: /var/task/pipelines.json
      Events:
        ScheduledSync:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled Databricks PRD to Supabase incremental sync
            Enabled: !If [ScheduledPipelinesOn, true, false]
            Input: '{"pipeline_name":"transportistas"}'
        ScheduledSecondarySync:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Scheduled Databricks QAS to secondary Supabase sync
            Enabled: !If [ScheduledPipelinesOn, true, false]
            Input: '{"pipeline_name":"vehiculos"}'
        ScheduledViajesSync:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Viajes (prod.gldlogistica.db_trade_fact_transportistas_viajes → ct_freights) — daily; disabled when ViajesScheduleEnabled=false
            Enabled: !If [ViajesScheduleOn, true, false]
            Input: '{"pipeline_name":"viajes"}'
        ScheduledConductoresSync:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Conductores (tertiary vw_maestro_persona_conductor → secondary drivers) — daily
            Enabled: !If [ScheduledPipelinesOn, true, false]
            Input: '{"pipeline_name":"conductores"}'
        ScheduledBaseSocioBatch:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Base Socio batch (grupos → ferreterias → materiales → facturas → cartera) secuencial
            Enabled: !If [ScheduledPipelinesOn, true, false]
            Input: '{"domain_batch":"base_socio"}'
      Policies:
        - AWSLambdaBasicExecutionRole
        - S3CrudPolicy:
            BucketName: !Ref EtlLogsBucket
    Metadata:
      BuildMethod: nodejs20.x

  SyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SyncFunction}
      RetentionInDays: 14

Outputs:
  SyncFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt SyncFunction.Arn
  SyncFunctionName:
    Description: Lambda function name
    Value: !Ref SyncFunction
  EtlLogsBucketName:
    Description: S3 bucket for ETL execution logs
    Value: !Ref EtlLogsBucket